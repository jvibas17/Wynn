<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Mobile & PWA -->
    <meta name="theme-color" content="#1e1b4b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=yes">

    <!-- Security & Performance -->
    <meta name="referrer" content="no-referrer-when-downgrade">
    <meta http-equiv="x-dns-prefetch-control" content="on">

    <!-- Per-route SEO tags (title, description, canonical, Open Graph, JSON-LD).
         Replaced at build time for every route by scripts/prerender.mjs using src/seo/pages.ts.
         The block below is only the dev-server fallback for the homepage. -->
    <!-- SEO:START -->
    <title>Wynn VIP Host Las Vegas | Winnie Lee</title>
    <meta name="description" content="Multilingual VIP host at Wynn Las Vegas. Winnie Lee helps with casino play, comps, dining, nightlife &amp; groups in English, Mandarin, Taiwanese &amp; Japanese.">
    <link rel="canonical" href="https://vegasviphost.net/">
    <!-- SEO:END -->

    <meta name="author" content="Winnie Lee">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="geo.region" content="US-NV">
    <meta name="geo.placename" content="Las Vegas">
    <meta name="geo.position" content="36.127;-115.169">
    <meta name="ICBM" content="36.127, -115.169">

    <!-- Preload Critical Resources -->
    <link rel="preconnect" href="https://images.unsplash.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
